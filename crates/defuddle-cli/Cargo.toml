[package]
name = "defuddle-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
alloc-profile = ["dep:dhat"]

[[bin]]
name = "defuddle"
path = "src/main.rs"

[dependencies]
atty = "0.2.14"
defuddle = { path = "../defuddle" }
dhat = { version = "0.3.3", optional = true }
lexopt = "0.3.2"
miniserde = "0.1.46"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rawzip = "0.5.2"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
