[package]
name = "defuddle-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
defuddle = { path = "../defuddle" }
deser = { version = "0.10", default-features = false, features = ["derive"] }
